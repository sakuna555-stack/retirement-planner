<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วางแผนเกษียณ by Nok SAKUNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --field:#f8fafc;
    --pre:#0f766e; --pre-soft:#e6f4f1; --pre-mid:#86c9bd;
    --post:#b45309; --post-soft:#fdf1e2; --post-mid:#e9b77a;
    --good:#15803d; --good-soft:#e7f6ec; --bad:#b91c1c; --bad-soft:#fdeceb;
    --gold:#d99a3d; --gray:#94a3b8;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
    --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:0 16px}
  .emo{font-family:var(--emoji);font-style:normal}

  /* ---------- Header ---------- */
  .hero-head{margin:24px 0 20px;border-radius:24px;padding:28px 32px;background:linear-gradient(120deg,#e6f4f1 0%,#fff6e8 55%,#ffe9ef 100%);display:flex;align-items:center;gap:24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .hero-head .txt{flex:1;min-width:0;position:relative;z-index:1}
  .hero-head h1{margin:0;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .hero-head h1 .by{display:inline-block;font-size:.5em;font-weight:600;vertical-align:middle;background:#fff;color:#c2185b;border-radius:999px;padding:3px 12px;margin-left:6px;box-shadow:0 1px 4px rgba(194,24,91,.15)}
  .hero-head p{margin:8px 0 0;color:var(--ink2);font-size:1.02rem}
  .quote{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--pre);font-size:.95rem;transition:opacity .4s}
  .mascot{flex:none;position:relative;width:150px;height:130px}
  .pig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:92px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(217,154,61,.3))}
  .coin{position:absolute;left:50%;top:-6px;font-size:30px;line-height:1;animation:drop 2.6s ease-in infinite}
  .spark{position:absolute;font-size:22px;animation:twinkle 2.2s ease-in-out infinite}
  .spark.s1{left:2px;top:22px}.spark.s2{right:0;top:44px;animation-delay:.8s}.spark.s3{left:18px;bottom:6px;animation-delay:1.4s;font-size:18px}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-3deg)}50%{transform:translateX(-50%) translateY(-6px) rotate(3deg)}}
  @keyframes drop{0%{transform:translate(-50%,-10px);opacity:0}15%{opacity:1}55%{transform:translate(-50%,38px);opacity:1}70%,100%{transform:translate(-50%,44px);opacity:0}}
  @keyframes twinkle{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1.1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.pig,.coin,.spark{animation:none}.coin{opacity:0}}
  @media (max-width:560px){.hero-head{padding:56px 20px 22px;flex-direction:column-reverse;text-align:center}.mascot{height:110px}.pig{font-size:76px}}

  /* Tools: language toggle + print */
  .tools{position:absolute;top:14px;right:16px;z-index:2;display:flex;gap:8px;align-items:center}
  .lang{display:flex;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .lang button[aria-pressed=true]{background:var(--ink);color:#fff}
  .lang button:focus-visible{outline:2px solid var(--pre);outline-offset:1px}
  .print{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:.82rem;color:var(--ink2);cursor:pointer}
  @media (max-width:560px){.print{display:none}.tools{left:0;right:0;justify-content:center}}

  /* ---------- แท็บ ---------- */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e7ebf1;padding:6px;border-radius:18px;margin-bottom:20px}
  .tab{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:14px;padding:10px 14px;font:inherit;cursor:pointer;text-align:left;color:var(--muted);transition:background .15s,box-shadow .15s}
  .tab .ic{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.6);display:grid;place-items:center;font-size:22px}
  .tab b{display:block;font-size:1.05rem;color:var(--ink2);font-weight:600;line-height:1.3}
  .tab small{font-size:.82rem}
  .tab:hover{background:rgba(255,255,255,.5)}
  .tab[aria-selected=true]{background:var(--card);box-shadow:var(--shadow)}
  .tab[aria-selected=true] .ic{background:var(--soft)}
  .tab[aria-selected=true] b{color:var(--accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:520px){.tab small{display:none}.tab{padding:8px 10px;gap:8px}.tab .ic{width:34px;height:34px;font-size:18px}}

  /* ---------- ส่วนเนื้อหา: ฟอร์มซ้าย ผลลัพธ์ขวา ---------- */
  .panel{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start;min-width:0}
  .panel[hidden]{display:none}
  #tab-pre,#pre{--accent:var(--pre);--soft:var(--pre-soft);--mid:var(--pre-mid)}
  #tab-post,#post{--accent:var(--post);--soft:var(--post-soft);--mid:var(--post-mid)}
  .panel > .ph{display:none}
  .panel > .form{position:sticky;top:16px}
  @media (max-width:900px){.panel{grid-template-columns:1fr}.panel > .form{position:static}}
  .ph{align-items:center;gap:12px;padding:4px 4px 0}
  .ph .ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:26px}
  .ph h2{margin:0;font-size:1.25rem;color:var(--accent);line-height:1.3}
  .ph p{margin:0;font-size:.88rem;color:var(--muted)}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;min-width:0}
  .form{border-top:4px solid var(--accent)}

  /* Fields */
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:420px){.row{grid-template-columns:1fr}}
  .f{margin-bottom:14px}
  .f label{display:block;font-size:.86rem;font-weight:500;color:var(--ink2);margin-bottom:5px}
  .help{font-size:.76rem;color:var(--muted);margin-top:4px}
  .in{position:relative}
  .in input{width:100%;padding:10px 52px 10px 12px;border:1.5px solid transparent;border-radius:12px;background:var(--field);font:inherit;font-weight:600;font-size:1rem;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
  .in input:hover{border-color:var(--line)}
  .in input:focus{outline:none;border-color:var(--accent);background:#fff}
  .in .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
  .slider-head{display:flex;justify-content:space-between;align-items:baseline}
  .slider-head output{font-size:1.35rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .slider-head output small{font-size:.85rem;font-weight:500;color:var(--muted)}
  input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0;cursor:pointer}
  .scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
  .stepper{display:flex;gap:6px}
  .stepper .in{flex:1}
  .stepper .in input{text-align:center;padding-right:40px}
  .stepper button{width:42px;border:0;border-radius:12px;background:var(--soft);color:var(--accent);font:inherit;font-size:1.2rem;font-weight:700;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font:inherit;font-size:.76rem;color:var(--muted);cursor:pointer}
  .chips button:hover{border-color:var(--accent);color:var(--accent)}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--ink2);cursor:pointer;margin:-2px 0 14px}
  .check input{accent-color:var(--accent);width:18px;height:18px;margin:2px 0 0;flex:none}
  .bad-f input[type=range]{accent-color:var(--bad)} .bad-f output{color:var(--bad)!important}
  details.more{border-top:1px solid var(--line);margin:2px -20px -20px;padding:0 20px}
  details.more summary{list-style:none;cursor:pointer;padding:13px 0;font-size:.86rem;font-weight:500;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin-right:4px}
  details.more[open] summary::after{transform:rotate(-135deg)}
  details.more[open]{padding-bottom:6px}

  /* Results */
  .results{display:grid;gap:14px;min-width:0}
  .banner{border-radius:14px;padding:11px 14px;font-weight:600;display:flex;gap:10px;align-items:center;font-size:.95rem}
  .banner::before{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85rem;font-weight:700}
  .banner.good{background:var(--good-soft);color:var(--good)} .banner.good::before{content:"✓";background:var(--good)}
  .banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.bad::before{content:"!";background:var(--bad)}
  .banner.info{background:var(--soft);color:var(--accent)} .banner.info::before{content:"i";background:var(--accent)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:460px){.kpis{grid-template-columns:1fr}}
  .kpi .k{font-size:.85rem;color:var(--muted)}
  .kpi .v{font-size:clamp(1.6rem,3.4vw,2.1rem);font-weight:700;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kpi .v small{font-size:.88rem;font-weight:500;color:var(--muted);margin-left:4px}
  .kpi .d{font-size:.8rem;color:var(--muted)}
  .kpi.main{background:var(--accent);color:#fff}
  .kpi.main .k,.kpi.main .d,.kpi.main .v small{color:rgba(255,255,255,.85)}
  .card h3{margin:0 0 2px;font-size:.98rem;font-weight:600}
  .card .cap{margin:0 0 10px;font-size:.82rem;color:var(--muted)}
  .facts{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  .facts li{display:flex;gap:10px;align-items:baseline;font-size:.9rem;color:var(--ink2)}
  .facts li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--mid);transform:translateY(-2px)}
  .facts b{color:var(--ink);font-variant-numeric:tabular-nums}
  .facts .warn,.facts .warn b{color:var(--bad)}
  .cheer{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#fff6e8,#ffeef3);border-radius:14px;padding:12px 14px;font-size:.92rem;color:var(--ink2)}
  .cheer .emo{font-size:30px;line-height:1}
  .cheer b{color:var(--ink)}
  .chart-box{position:relative;height:260px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
  .nochart{display:none;font-size:.85rem;color:var(--muted);padding:16px;border:1px dashed var(--line);border-radius:12px;text-align:center}
  .comp{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;margin:6px 0 12px}
  .comp-lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .comp-lg div{font-size:.8rem;color:var(--muted)}
  .comp-lg b{display:block;font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .comp-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
  .alts{display:grid;gap:8px}
  .alt{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--field);border-radius:12px;padding:10px 12px;font-size:.88rem}
  .alt .r{text-align:right;white-space:nowrap}
  .alt .r b{font-variant-numeric:tabular-nums}
  .alt .r span{display:block;font-size:.76rem;color:var(--good);font-weight:600}
  details.data summary{cursor:pointer;font-weight:600;font-size:.92rem}
  table.kv{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
  table.kv td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.kv td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
  .tbl-wrap{max-height:300px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}
  table.yr{width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
  table.yr th{position:sticky;top:0;background:var(--field);padding:8px 10px;text-align:right;font-weight:600;color:var(--ink2)}
  table.yr th:first-child,table.yr td:first-child{text-align:center}
  table.yr td{padding:6px 10px;text-align:right;border-top:1px solid var(--line)}
  table.yr tr.hl td{background:#fff7d6}
  table.yr td.neg{color:var(--bad)}
  .note{font-size:.76rem;color:var(--muted);margin:10px 0 0}
  .errbox{display:none;background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:14px 16px;font-weight:600}
  .results.error .errbox{display:block}
  .results.error > :not(.errbox){display:none}

  .gloss{margin:28px 0 12px}
  .gloss h2{font-size:1rem;font-weight:600;margin:0 0 12px}
  .gloss dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0}
  .gloss dl div{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .gloss dt{font-weight:600}
  .gloss dd{margin:2px 0 0;color:var(--muted);font-size:.86rem}
  footer{padding:8px 0 36px;color:var(--muted);font-size:.8rem;text-align:center}

  @media print{
    body{background:#fff} .tools,.chips,.stepper button,.mascot{display:none}
    .tabs{display:none} .panel[hidden],.panel{display:grid;grid-template-columns:1fr;break-inside:avoid;margin-bottom:24px}
    .panel > .ph{display:flex} .panel > .form{position:static}
    .card,.hero-head{box-shadow:none;border:1px solid var(--line)} .tbl-wrap{max-height:none}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="hero-head">
  <div class="tools">
    <div class="lang" role="group" aria-label="Language / ภาษา">
      <button type="button" data-lang="th" aria-pressed="true">ไทย</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="print" onclick="window.print()" data-i18n="print">พิมพ์ / PDF</button>
  </div>
  <div class="txt">
    <h1><span data-i18n="title">วางแผนเกษียณ</span> <span class="by">by Nok SAKUNA</span></h1>
    <p data-i18n="subtitle">กรอกตัวเลขไม่กี่ช่อง รู้ทันทีว่าต้องเก็บเท่าไร และเงินพอใช้ไหม</p>
    <div class="quote" id="quote"></div>
  </div>
  <div class="mascot" aria-hidden="true">
    <span class="emo spark s1">✨</span><span class="emo spark s2">💖</span><span class="emo spark s3">⭐</span>
    <span class="emo coin">🪙</span>
    <span class="emo pig">🐦‍🔥</span>
  </div>
</header>

<div class="tabs" role="tablist" data-i18n-aria="tabsAria">
  <button class="tab" id="tab-pre" role="tab" aria-selected="true" aria-controls="pre"><span class="ic emo">💼</span><span><b data-i18n="tabPre"></b><small data-i18n="tabPreSub"></small></span></button>
  <button class="tab" id="tab-post" role="tab" aria-selected="false" aria-controls="post" tabindex="-1"><span class="ic emo">🏖️</span><span><b data-i18n="tabPost"></b><small data-i18n="tabPostSub"></small></span></button>
</div>

<main>
<!-- ===================== ยังทำงานอยู่ ===================== -->
<section class="panel" id="pre" role="tabpanel" aria-labelledby="tab-pre">
  <div class="ph"><div class="ic emo">💼</div><div><h2 data-i18n="tabPre"></h2><p data-i18n="phPre"></p></div></div>

  <div class="card form">
    <div class="row">
      <div class="f"><label for="p_age" data-i18n="age"></label><div class="in"><input id="p_age" data-num value="35"><span class="u" data-i18n="uYr"></span></div></div>
      <div class="f"><label for="p_life" data-i18n="lifePre"></label><div class="in"><input id="p_life" data-num value="85"><span class="u" data-i18n="uYr"></span></div></div>
    </div>
    <div class="f" id="p_retire_box">
      <div class="slider-head"><label for="p_retire" data-i18n="retire"></label><output id="p_retire_out"></output></div>
      <input type="range" id="p_retire" min="30" max="80" step="1" value="60">
      <div class="scale"><span>30</span><span>40</span><span>50</span><span>60</span><span>70</span><span>80</span></div>
    </div>
    <div class="row">
      <div class="f"><label for="p_expense" data-i18n="expPre"></label><div class="in"><input id="p_expense" data-money value="30,000"><span class="u" data-i18n="uBaht"></span></div>
        <div class="help" data-i18n="expPreHelp"></div></div>
      <div class="f"><label for="p_saved" data-i18n="saved"></label><div class="in"><input id="p_saved" data-money value="500,000"><span class="u" data-i18n="uBaht"></span></div>
        <div class="help" data-i18n="savedHelp"></div></div>
    </div>
    <details class="more">
      <summary data-i18n="more"></summary>
      <div class="f"><label for="p_inf" data-i18n="inf"></label>
        <div class="stepper"><button type="button" data-step="p_inf" data-delta="-0.5" data-i18n-aria="less">−</button><div class="in"><input id="p_inf" data-num value="3"><span class="u">%</span></div><button type="button" data-step="p_inf" data-delta="0.5" data-i18n-aria="more_">+</button></div>
        <div class="help" data-i18n="infHelp"></div></div>
      <div class="f"><label for="p_rpre" data-i18n="rPre"></label><div class="in"><input id="p_rpre" data-num value="6"><span class="u" data-i18n="uPctYr"></span></div>
        <div class="chips" data-for="p_rpre"><button type="button" data-v="1.5"><span data-i18n="cDeposit"></span> 1.5%</button><button type="button" data-v="4"><span data-i18n="cMixed"></span> 4%</button><button type="button" data-v="6"><span data-i18n="cStocks"></span> 6%</button></div></div>
      <div class="f"><label for="p_rpost" data-i18n="rPost"></label><div class="in"><input id="p_rpost" data-num value="4"><span class="u" data-i18n="uPctYr"></span></div>
        <div class="chips" data-for="p_rpost"><button type="button" data-v="1.5"><span data-i18n="cDeposit"></span> 1.5%</button><button type="button" data-v="3"><span data-i18n="cBonds"></span> 3%</button><button type="button" data-v="4"><span data-i18n="cMixed"></span> 4%</button></div></div>
    </details>
  </div>

  <div class="results" id="p_res" aria-live="polite">
    <div class="errbox" id="p_err"></div>
    <div class="banner" id="p_banner"></div>
    <div class="kpis">
      <div class="card kpi main"><div class="k" data-i18n="kPmt"></div><div class="v" id="p_pmt"></div><div class="d" id="p_pmt_d"></div></div>
      <div class="card kpi"><div class="k" data-i18n="kNeed"></div><div class="v" id="p_need"></div><div class="d" id="p_need_d"></div></div>
    </div>
    <div class="cheer" id="p_cheer"></div>
    <div class="card"><ul class="facts" id="p_facts"></ul></div>

    <div class="card">
      <h3 data-i18n="chartPre"></h3>
      <p class="cap" data-i18n="capHover"></p>
      <div class="chart-box"><canvas id="p_chart" role="img" data-i18n-aria="chartPre"></canvas></div>
      <div class="nochart" id="p_nochart" data-i18n="noChart"></div>

    factYears: (m, a, b) => 'Your money needs to last <b>' + m + ' years</b> (age ' + a + '–' + b + ')',
    factEmpty: a => 'Without extra saving, money runs out at age <b>' + a + '</b>',
    mkRetire: a => 'Retire ' + a, mkTarget: a => 'Target ' + a,
    dsSavings: 'Savings', dsLeft: 'Balance',
    tipTitle: a => 'Age ' + a, tipEmpty: 'Run out',
    compSaved: 'Current savings', compContrib: 'Monthly saving', compGrowth: 'Investment growth',
    altLater: a => 'Retire 5 years later (age ' + a + ')',
    altSpend: x => 'Spend 20% less (' + x + '/mo)',
    altReturn: r => 'Invest for a ' + r + '% return',
    altDown: x => x + ' less',
    bannerPostOk: (a, x) => 'Enough until age ' + a + (x ? ' · ~' + x + ' THB to spare' : ''),
    bannerPostBad: y => 'Money runs out ' + y + ' years before your target',
    untilD: (y, m) => y + ' yrs ' + m + ' mo left',
    forever: 'For life', foreverD: "Your money won't run out",
    cheerPostOk: a => '<b>Relax!</b> Your money lasts until ' + a + '. Travel and enjoy what you love.',
    cheerPostBad: (x, a) => "Don't worry — a small change fixes it. Spend <b>" + x + ' THB/mo</b> and it lasts until ' + a + '.',
    factMax: (x, a) => 'You could spend up to about <b>' + x + '</b> THB/mo and still last until ' + a,
    factNeed: (a, x) => 'Savings needed to last until ' + a + ': <b>' + x + ' THB</b>',
    factShort: x => ' <span class="warn">(' + x + ' short)</span>',
    factReturn: (r, i) => 'Savings grow <b>' + r + '%</b>/yr, but spending also rises <b>' + i + '%</b>/yr',
    gone: 'Gone'
  }
};
let LANG = 'th';
const t = k => I18N[LANG][k];

/* ---------- ตัวช่วย ---------- */
const fmt0 = new Intl.NumberFormat('en-US', {maximumFractionDigits:0});
const fmt1 = new Intl.NumberFormat('en-US', {maximumFractionDigits:1});
const baht = v => fmt0.format(Math.round(v)) + ' ' + t('baht');
const short = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return fmt1.format(v/1e6) + t('million');
  if (a >= 1e4) return fmt0.format(Math.round(v/1e3) * 1e3);
  return fmt0.format(Math.round(v));
};
const val = id => { const n = parseFloat(String(document.getElementById(id).value).replace(/,/g,'')); return isNaN(n) ? NaN : n; };
const $ = id => document.getElementById(id);
const set = (id, html) => $(id).innerHTML = html;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mRate = pct => Math.pow(1 + pct/100, 1/12) - 1;

/* ---------- สลับภาษา ---------- */
function applyLang(lang){
  LANG = I18N[lang] ? lang : 'th';
  document.documentElement.lang = LANG;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  showQuote();
  updateRetireOut();
  calcPre(); calcPost();
  try { localStorage.setItem('retireLang', LANG); } catch (e) {}
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

/* ---------- คำคมให้กำลังใจ ---------- */
let qi = 0;
function showQuote(){
  const q = t('quotes')[qi % t('quotes').length];
  $('quote').innerHTML = '<span class="emo">' + q[0] + '</span><span>' + q[1] + '</span>';
}
setInterval(() => {
  const q = $('quote'); q.style.opacity = 0;
  setTimeout(() => { qi++; showQuote(); q.style.opacity = 1; }, 400);
}, 5000);

/* ---------- ช่องกรอก ---------- */
document.querySelectorAll('input[data-money]').forEach(el => {
  el.setAttribute('inputmode','decimal');
  el.addEventListener('input', () => {
    const raw = el.value.replace(/[^\d.]/g,'');
    const [i, ...d] = raw.split('.');
    const pos = el.value.length - el.selectionStart;
    let out = i ? fmt0.format(Number(i)) : '';
    if (d.length) out += '.' + d.join('').slice(0,2);
    el.value = out;
    const p = Math.max(0, el.value.length - pos);
    el.setSelectionRange(p, p);
  });
});
document.querySelectorAll('input[data-num]').forEach(el => {
  el.setAttribute('inputmode','decimal');
  el.addEventListener('input', () => { el.value = el.value.replace(/[^\d.]/g,''); });
});
document.querySelectorAll('button[data-step]').forEach(b => b.addEventListener('click', () => {
  const el = $(b.dataset.step);
  el.value = String(Math.min(15, Math.max(0, Math.round(((parseFloat(el.value) || 0) + parseFloat(b.dataset.delta)) * 100) / 100)));
  el.dispatchEvent(new Event('input', {bubbles:true}));
}));
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => {
  const el = $(b.parentElement.dataset.for);
  el.value = b.dataset.v;
  el.dispatchEvent(new Event('input', {bubbles:true}));
}));
function syncChips(){
  document.querySelectorAll('.chips').forEach(c => {
    const v = val(c.dataset.for);
    c.querySelectorAll('button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.v) === v));
  });
}
const updateRetireOut = () => $('p_retire_out').innerHTML = t('yrs')($('p_retire').value);
const timers = {};
['pre','post'].forEach(p => ['input','change'].forEach(ev => $(p).addEventListener(ev, () => {
  syncChips();
  if (p === 'pre') updateRetireOut();
  clearTimeout(timers[p]);
  timers[p] = setTimeout(p === 'pre' ? calcPre : calcPost, 120);
})));

function fail(k, msg){
  $(k+'_res').classList.toggle('error', !!msg);
  $(k+'_err').textContent = msg || '';
  return !!msg;
}

function requiredFund(expM, penM, inf, r, years, penInf){
  const i = mRate(r);
  let pv = 0;
  for (let y = 0; y < years; y++){
    const e = expM * Math.pow(1+inf/100, y);
    const p = penInf ? penM * Math.pow(1+inf/100, y) : penM;
    const net = Math.max(0, e - p);
    for (let m = 0; m < 12; m++) pv += net / Math.pow(1+i, 12*y + m);
  }
  return pv;
}

/* ---------- กราฟแท่ง ---------- */
const charts = {};
const hasChart = typeof Chart !== 'undefined';
if (hasChart){
  Chart.defaults.font.family = '"IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif';
  Chart.defaults.font.size = 12;
  Chart.defaults.color = '#64748b';
}
const markerPlugin = {
  id: 'markers',
  afterDatasetsDraw(chart, _a, opts){
    const {ctx, chartArea:{top,bottom}, scales:{x}} = chart;
    (opts.items || []).forEach(m => {
      if (m.idx < 0 || m.idx >= chart.data.labels.length) return;
      const px = x.getPixelForValue(m.idx) - (m.left ? x.width / chart.data.labels.length / 2 : 0);
      ctx.save();
      ctx.strokeStyle = m.color; ctx.lineWidth = 1.5; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px, bottom); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '600 12px "IBM Plex Sans Thai", Tahoma, sans-serif';
      const w = ctx.measureText(m.label).width + 16;
      const tx = Math.min(Math.max(px - w/2, x.left), x.right - w);
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.roundRect(tx, top - 22, w, 20, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(m.label, tx + 8, top - 8);
      ctx.restore();
    });
  }
};
function drawBars(k, labels, data, colors, markers, seriesLabel){
  $(k+'_nochart').style.display = hasChart ? 'none' : 'block';
  $(k+'_chart').parentElement.style.display = hasChart ? 'block' : 'none';
  if (!hasChart) return;
  const ds = { label: seriesLabel, data, backgroundColor: colors, hoverBackgroundColor: colors,
    borderRadius: {topLeft: 4, topRight: 4}, borderSkipped: 'bottom', barPercentage: .78, categoryPercentage: .92 };
  if (charts[k]){
    const c = charts[k];
    c.data.labels = labels; c.data.datasets = [ds];
    c.options.plugins.markers.items = markers;
    c.update();
    return;
  }
  charts[k] = new Chart($(k+'_chart'), {
    type: 'bar',
    data: { labels, datasets: [ds] },
    plugins: [markerPlugin],
    options: {
      responsive: true, maintainAspectRatio: false, animation: {duration: 350},
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 26, right: 4 } },
      scales: {
        x: { grid: { display: false }, border: {color:'#e2e8f0'},
             ticks: { autoSkip: false, maxRotation: 0, callback: function(v){ const a = this.getLabelForValue(v); return a % 5 === 0 ? a : ''; } } },
        y: { beginAtZero: true, border: {display:false}, grid: { color: '#eef1f5' },
             ticks: { callback: v => short(v), maxTicksLimit: 5 } }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#0f172a', padding: 10, cornerRadius: 10, displayColors: false,
          titleFont: {weight: '600'},
          callbacks: {
            title: it => t('tipTitle')(it[0].label),
            label: c => c.dataset.label + ': ' + (c.parsed.y <= 0 ? t('tipEmpty') : baht(c.parsed.y))
          }
        },
        markers: { items: markers }
      }
    }
  });
}

/* ---------- ยังทำงานอยู่ ---------- */
function planPre(age, ret, exp, saved, inf, rPre, rPost, life){
  const n = ret - age, m = life - ret;
  const expAtRet = exp * Math.pow(1+inf/100, n);
  const need = requiredFund(expAtRet, 0, inf, rPost, m, false);
  const fvSaved = saved * Math.pow(1+rPre/100, n);
  const gap = Math.max(0, need - fvSaved);
  const i = mRate(rPre), N = n*12;
  const pmt = gap <= 0 ? 0 : (i === 0 ? gap/N : gap * i / (Math.pow(1+i, N) - 1));
  return {n, m, N, expAtRet, need, fvSaved, gap, pmt};
}
function simulatePre(age, ret, life, saved, pmt, expAtRet, inf, rPre, rPost){
  const iPre = mRate(rPre), iPost = mRate(rPost);
  let bal = saved, pts = [{age, y:bal}], emptyAt = null;
  for (let a = age; a < ret; a++){
    for (let k = 0; k < 12; k++) bal = bal * (1 + iPre) + pmt;
    pts.push({age:a+1, y:bal});
  }
  for (let y = 0; ret + y < life; y++){
    const e = expAtRet * Math.pow(1+inf/100, y);
    for (let k = 0; k < 12; k++){
      if (bal < e - 0.5 && emptyAt === null) emptyAt = ret + y + (k + bal/e)/12;
      bal = Math.max(0, (bal - e) * (1 + iPost));
    }
    pts.push({age:ret+y+1, y:bal < 1 ? 0 : bal});
  }
  return {pts, emptyAt};
}

function calcPre(){
  const age = val('p_age'), ret = val('p_retire'), exp = val('p_expense'), saved = val('p_saved') || 0;
  const inf = val('p_inf'), rPre = val('p_rpre'), rPost = val('p_rpost'), life = val('p_life');
  $('p_retire_box').classList.toggle('bad-f', !isNaN(age) && ret <= age);
  if ([age,ret,exp,inf,rPre,rPost,life].some(isNaN)) return fail('p', t('errFill'));
  if (ret <= age) return fail('p', t('errRetire'));
  if (life <= ret) return fail('p', t('errLife'));
  fail('p','');

  const P = planPre(age, ret, exp, saved, inf, rPre, rPost, life);
  const pmtC = Math.ceil(P.pmt), contrib = pmtC * P.N;
  const plan = simulatePre(age, ret, life, saved, pmtC, P.expAtRet, inf, rPre, rPost);
  const none = pmtC > 0 ? simulatePre(age, ret, life, saved, 0, P.expAtRet, inf, rPre, rPost) : null;

  const b = $('p_banner');
  b.className = 'banner ' + (pmtC > 0 ? 'info' : 'good');
  b.textContent = pmtC > 0 ? t('bannerPre')(baht(pmtC)) : t('bannerPreOk');

  set('p_pmt', fmt0.format(pmtC) + '<small>' + t('perMonth') + '</small>');
  set('p_pmt_d', pmtC > 0 ? t('pmtD')(P.n) : t('pmtDOk')(short(P.fvSaved - P.need)));
  set('p_need', short(P.need) + '<small>' + t('baht') + '</small>');
  set('p_need_d', t('atAge')(ret));

  const daily = Math.ceil(pmtC / 30);
  set('p_cheer', pmtC > 0
    ? '<span class="emo">🐦‍🔥</span><span>' + t('cheerPre')(fmt0.format(daily), daily <= 100) + ' <span class="emo">💪</span></span>'
    : '<span class="emo">🎉</span><span>' + t('cheerPreOk') + '</span>');

  const facts = [
    t('factInfl')(fmt0.format(exp), fmt0.format(Math.round(P.expAtRet)), ret),
    t('factYears')(P.m, ret, life)
  ];
  if (none && none.emptyAt !== null) facts.push('<span class="warn">' + t('factEmpty')(fmt0.format(Math.floor(none.emptyAt))) + '</span>');
  set('p_facts', facts.map(f => '<li><span>' + f + '</span></li>').join(''));

  const pre = css('--pre'), preMid = css('--pre-mid');
  drawBars('p', plan.pts.map(p => p.age), plan.pts.map(p => p.y),
    plan.pts.map(p => p.age < ret ? pre : preMid),
    [{idx: ret - age, left: true, label: t('mkRetire')(ret), color: pre}], t('dsSavings'));

  const total = Math.max(P.need, P.fvSaved), growth = Math.max(0, total - saved - contrib);
  const parts = [
    {l:t('compSaved'), v:saved, c:preMid},
    {l:t('compContrib'), v:contrib, c:pre},
    {l:t('compGrowth'), v:growth, c:css('--gold')}
  ].filter(p => p.v > 0);
  const sum = parts.reduce((s,p) => s + p.v, 0) || 1;
  set('p_comp', parts.map(p => '<div style="flex:' + p.v + ';background:' + p.c + '" title="' + p.l + '"></div>').join(''));
  set('p_comp_lg', parts.map(p => '<div><i style="background:' + p.c + '"></i>' + p.l + '<b>' + short(p.v) + ' · ' + Math.round(p.v/sum*100) + '%</b></div>').join(''));

  const alts = [];
  if (pmtC > 0){
    if (ret + 5 < life) alts.push([t('altLater')(ret+5), planPre(age, ret+5, exp, saved, inf, rPre, rPost, life).pmt]);
    alts.push([t('altSpend')(fmt0.format(exp*0.8)), planPre(age, ret, exp*0.8, saved, inf, rPre, rPost, life).pmt]);
    if (rPre < 6) alts.push([t('altReturn')(fmt1.format(rPre+2)), planPre(age, ret, exp, saved, inf, rPre+2, rPost, life).pmt]);
  }
  $('p_alts_card').style.display = alts.length ? '' : 'none';
  set('p_alts', alts.map(([txt, v]) => {
    const vc = Math.ceil(v);
    return '<div class="alt"><span>' + txt + '</span><span class="r"><b>' + fmt0.format(vc) + '</b> ' + t('perMonth') + '<span>' + t('altDown')(fmt0.format(pmtC - vc)) + '</span></span></div>';
  }).join(''));

  set('p_r_n', t('yrsPlain')(P.n));
  set('p_r_m', t('yrsPlain')(P.m));
  set('p_r_exp', baht(P.expAtRet));
  set('p_r_fv', baht(P.fvSaved));
  set('p_r_gap', baht(P.gap));
  set('p_r_total', baht(contrib));
}

/* ---------- เกษียณแล้ว ---------- */
function calcPost(){
  const age = val('q_age'), lump = val('q_lump'), exp = val('q_expense'), pen = val('q_pension') || 0;
  const inf = val('q_inf'), r = val('q_r'), life = val('q_life');
  const penInf = $('q_pinf').checked;
  if ([age,lump,exp,inf,r,life].some(isNaN)) return fail('q', t('errFill'));
  if (life <= age) return fail('q', t('errTarget'));
  fail('q','');

  const MAX_AGE = 120, i = mRate(r);
  let bal = lump, months = 0, depleted = false, rows = [];
  for (let y = 0; age + y < MAX_AGE && !depleted; y++){
    const e = exp * Math.pow(1+inf/100, y);
    const p = penInf ? pen * Math.pow(1+inf/100, y) : pen;
    const net = e - p;
    for (let mo = 0; mo < 12; mo++){
      if (net > 0 && bal < net){ depleted = true; months += bal / net; bal = 0; break; }
      bal = (bal - net) * (1 + i);
      months++;
    }
    rows.push({age: age + y, e, p, bal});
  }
  const untilAge = age + months/12;
  const ok = !depleted || untilAge >= life;
  const need = requiredFund(exp, pen, inf, r, life - age, penInf);
  const diff = lump - need;
  const net0 = exp - pen;

  let lo = 0, hi = Math.max(exp, pen) * 4 + lump / 12;
  for (let k = 0; k < 50; k++){ const mid = (lo + hi) / 2; requiredFund(mid, pen, inf, r, life - age, penInf) > lump ? hi = mid : lo = mid; }
  const maxExp = Math.floor(lo / 100) * 100;

  const b = $('q_banner');
  b.className = 'banner ' + (ok ? 'good' : 'bad');
  b.textContent = ok ? t('bannerPostOk')(life, diff > 0 ? short(diff) : '') : t('bannerPostBad')(fmt1.format(life - untilAge));

  if (depleted){
    set('q_until', t('yrs')(fmt0.format(Math.floor(untilAge))));
    set('q_until_d', t('untilD')(Math.floor(months/12), Math.floor(months % 12)));
  } else {
    set('q_until', t('forever'));
    set('q_until_d', t('foreverD'));
  }
  set('q_net', (net0 > 0 ? fmt0.format(Math.round(net0)) : '0') + '<small>' + t('perMonth') + '</small>');

  set('q_cheer', ok
    ? '<span class="emo">🌴</span><span>' + t('cheerPostOk')(life) + '</span>'
    : '<span class="emo">🤗</span><span>' + t('cheerPostBad')(fmt0.format(maxExp), life) + '</span>');

  const facts = [];
  if (ok) facts.push(t('factMax')(fmt0.format(maxExp), life));
  facts.push(t('factNeed')(life, short(need)) + (ok ? '' : t('factShort')(short(-diff))));
  facts.push(t('factReturn')(fmt1.format(r), fmt1.format(inf)));
  set('q_facts', facts.map(f => '<li><span>' + f + '</span></li>').join(''));

  const xMax = Math.max(life + 2, depleted ? Math.ceil(untilAge) + 2 : Math.min(MAX_AGE, life + 5));
  const labels = [], data = [];
  for (let a = age; a <= xMax; a++){
    labels.push(a);
    data.push(a === age ? lump : (rows[a - age - 1] ? Math.max(0, rows[a - age - 1].bal) : 0));
  }
  const post = css('--post'), postMid = css('--post-mid');
  drawBars('q', labels, data, labels.map(a => a <= life ? post : postMid),
    [{idx: life - age, label: t('mkTarget')(life), color: ok ? css('--good') : css('--bad')}], t('dsLeft'));

  $('q_tbody').innerHTML = rows.map(rw =>
    '<tr' + (rw.age === life - 1 ? ' class="hl"' : '') + '><td>' + rw.age + '</td><td>' + fmt0.format(Math.round(rw.e)) +
    '</td><td>' + fmt0.format(Math.round(rw.p)) + '</td><td' + (rw.bal <= 0 ? ' class="neg"' : '') + '>' +
    (rw.bal <= 0 ? t('gone') : fmt0.format(Math.round(rw.bal))) + '</td></tr>').join('');
}

/* ---------- แท็บ ---------- */
const TABS = [['tab-pre','pre','p'], ['tab-post','post','q']];
function showTab(id){
  TABS.forEach(([tb, p, k]) => {
    const on = tb === id;
    $(tb).setAttribute('aria-selected', on);
    $(tb).tabIndex = on ? 0 : -1;
    $(p).hidden = !on;
    if (on && charts[k]) charts[k].resize();
  });
  try { localStorage.setItem('retireTab', id); } catch (e) {}
}
TABS.forEach(([tb]) => $(tb).addEventListener('click', () => showTab(tb)));
$('tab-pre').parentElement.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const next = document.activeElement.id === 'tab-pre' ? 'tab-post' : 'tab-pre';
  showTab(next); $(next).focus();
});
window.addEventListener('beforeprint', () => Object.values(charts).forEach(c => c.resize()));

/* ---------- เริ่มต้น: ภาษาจาก ?lang=en หรือที่เคยเลือกไว้ ---------- */
let startLang = new URLSearchParams(location.search).get('lang');
if (!startLang) { try { startLang = localStorage.getItem('retireLang'); } catch (e) {} }
try { const savedTab = localStorage.getItem('retireTab'); if (savedTab && $(savedTab)) showTab(savedTab); } catch (e) {}
syncChips();
applyLang(startLang || 'th');
</script>
